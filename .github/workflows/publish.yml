# Publishes to the Comfy Registry when pyproject.toml changes on main.
# Requires: GitHub secret REGISTRY_ACCESS_TOKEN (Comfy Registry personal access token).
# See: https://docs.comfy.org/registry/publishing

name: Publish to Comfy registry

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish custom node to registry
    runs-on: ubuntu-latest
    # Skip on forks or wrong owner until repo is under VirusShell on GitHub
    if: ${{ github.repository_owner == 'VirusShell' }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
